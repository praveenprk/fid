[package]
name = "fid-python"
version = "0.1.0"
edition = "2021"
description = "Python bindings for fid, information fidelity measurement"
license = "Apache-2.0"
repository = "https://github.com/praveenprk/fid"
publish = false

[lib]
name = "_fid"
crate-type = ["cdylib"]

[dependencies]
fid = { package = "fidmeter", version = "0.1", path = "../.." }
pyo3 = { version = "0.29", features = ["extension-module", "abi3-py39"] }
chrono = "0.4"
serde_json = { version = "1", features = ["float_roundtrip"] }
