name: Commit check

# The PR title, description and every commit a PR brings to main follow
# eng-principles ENG-STD-005 §1 (format, anchors that resolve, no co-author
# or tool attribution). The check is eng-principles' shared workflow,
# pinned to a commit (ENG-DEC-009, DECISION-006). fid's policy is
# scripts/hooks/types and scripts/hooks/anchors. Its `questions` job fails a
# pull request into main while docs/QUESTIONS.md has an OPEN entry
# (ENG-DEC-010, DECISION-007).
# Since eng-principles f13eb83 (ENG-DEC-021), a Dependabot pull request
# passes with Dependabot's own title, and its GitHub-signed version-bump
# commits need no anchor; the author is taken from the event, not the PR text.
on:
  pull_request:
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read
  issues: read
  pull-requests: read

jobs:
  commit-check:
    uses: praveenprk/eng-principles/.github/workflows/commit-check.yml@f13eb831c53c112356bdf14ea600abfcb6bb4c22
    with:
      config: scripts/hooks
