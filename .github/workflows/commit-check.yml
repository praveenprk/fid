name: Commit check

# The PR title, description and every commit a PR brings to main follow
# eng-principles ENG-STD-005 §1 (format, anchors that resolve, no co-author
# or tool attribution). The check is eng-principles' shared workflow,
# pinned to a commit (ENG-DEC-009, DECISION-006). fid's policy is
# scripts/hooks/types and scripts/hooks/anchors. Its `questions` job fails a
# pull request into main while docs/QUESTIONS.md has an OPEN entry
# (ENG-DEC-010, DECISION-007).
on:
  pull_request:
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read
  issues: read
  pull-requests: read

jobs:
  commit-check:
    uses: praveenprk/eng-principles/.github/workflows/commit-check.yml@f972b72d677281e33373ed6e3368027ec443a4d0
    with:
      config: scripts/hooks
