name: Release

# Push a tag vX.Y.Z to publish the fidmeter crate to crates.io and the
# fidmeter package (import fid) to PyPI. The tag must match both versions.
#
# To publish (or retry) the Python package for an existing tag without
# touching crates.io: run this workflow by hand with that tag.
#
# One-time setup:
#   crates.io  repository secret CARGO_REGISTRY_TOKEN (a token scoped to
#              publish-new and publish-update for fidmeter)
#   PyPI       a trusted publisher for project fidmeter: owner praveenprk,
#              repository fid, workflow release.yml, environment pypi

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build and publish to PyPI (crates.io is skipped)"
        required: true

env:
  # The tag being released, from the push or the manual run
  TAG: ${{ inputs.tag || github.ref_name }}

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ env.TAG }}
      # Nothing is published from a tag GitHub cannot verify (AGENTS.md,
      # Releases; eng-principles ENG-STD-005 §5.1; OpenSSF Scorecard
      # Signed-Releases; V-ENG-008-01). Every publishing job needs `check`.
      - name: Tag is annotated, signed and verified by GitHub
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          type=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" --jq .object.type)
          sha=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" --jq .object.sha)
          if [ "$type" != tag ]; then
            echo "::error::$TAG is a lightweight tag: tag with git tag -s"
            exit 1
          fi
          verified=$(gh api "repos/$GITHUB_REPOSITORY/git/tags/$sha" --jq .verification.verified)
          reason=$(gh api "repos/$GITHUB_REPOSITORY/git/tags/$sha" --jq .verification.reason)
          echo "tag=$TAG object=$sha verified=$verified reason=$reason"
          if [ "$verified" != true ]; then
            echo "::error::$TAG is not signed with a key GitHub verifies ($reason)"
            exit 1
          fi
      # Releases are tagged on `stable` (DECISION-008): a signed tag on any
      # other branch publishes nothing.
      - name: Tagged commit is on stable
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          commit=$(git rev-parse HEAD)
          status=$(gh api "repos/$GITHUB_REPOSITORY/compare/$commit...stable" --jq .status)
          echo "tag=$TAG commit=$commit stable is $status of it"
          case "$status" in
            identical | ahead) ;;
            *)
              echo "::error::$TAG ($commit) is not on stable"
              exit 1
              ;;
          esac
      - name: Tag matches Cargo.toml and pyproject.toml
        run: |
          tag="${TAG#v}"
          crate=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          py=$(grep -m1 '^version' bindings/python/pyproject.toml | cut -d'"' -f2)
          echo "tag=$tag crate=$crate python=$py"
          test "$tag" = "$crate" && test "$tag" = "$py"
      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
        with:
          toolchain: stable
      - run: cargo test

  wheels:
    needs: check
    strategy:
      matrix:
        include:
          - { os: ubuntu-latest, target: x86_64 }
          - { os: ubuntu-latest, target: aarch64 }
          - { os: macos-latest, target: aarch64 }
          - { os: macos-latest, target: x86_64 }
          - { os: windows-latest, target: x64 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ env.TAG }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          working-directory: bindings/python
          target: ${{ matrix.target }}
          args: --release --out dist
          manylinux: auto
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: wheels-${{ matrix.os }}-${{ matrix.target }}
          path: bindings/python/dist

  sdist:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ env.TAG }}
      - uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          working-directory: bindings/python
          command: sdist
          args: --out dist
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: sdist
          path: bindings/python/dist

  pypi:
    needs: [wheels, sdist]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: dist
          merge-multiple: true
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          packages-dir: dist

  crates:
    needs: check
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ env.TAG }}
      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
        with:
          toolchain: stable
      - run: cargo publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
