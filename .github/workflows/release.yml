name: Release

# Push a tag vX.Y.Z to publish the fidmeter crate to crates.io and the
# fidmeter package (import fid) to PyPI. The tag must match both versions.
#
# To publish (or retry) the Python package for an existing tag without
# touching crates.io: run this workflow by hand with that tag.
#
# One-time setup:
#   crates.io  repository secret CARGO_REGISTRY_TOKEN (a token scoped to
#              publish-new and publish-update for fidmeter)
#   PyPI       a trusted publisher for project fidmeter: owner praveenprk,
#              repository fid, workflow release.yml, environment pypi

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build and publish to PyPI (crates.io is skipped)"
        required: true

env:
  # The tag being released, from the push or the manual run
  TAG: ${{ inputs.tag || github.ref_name }}

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - name: Tag matches Cargo.toml and pyproject.toml
        run: |
          tag="${TAG#v}"
          crate=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          py=$(grep -m1 '^version' bindings/python/pyproject.toml | cut -d'"' -f2)
          echo "tag=$tag crate=$crate python=$py"
          test "$tag" = "$crate" && test "$tag" = "$py"
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test

  wheels:
    needs: check
    strategy:
      matrix:
        include:
          - { os: ubuntu-latest, target: x86_64 }
          - { os: ubuntu-latest, target: aarch64 }
          - { os: macos-latest, target: aarch64 }
          - { os: macos-latest, target: x86_64 }
          - { os: windows-latest, target: x64 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: PyO3/maturin-action@v1
        with:
          working-directory: bindings/python
          target: ${{ matrix.target }}
          args: --release --out dist
          manylinux: auto
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.os }}-${{ matrix.target }}
          path: bindings/python/dist

  sdist:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - uses: PyO3/maturin-action@v1
        with:
          working-directory: bindings/python
          command: sdist
          args: --out dist
      - uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: bindings/python/dist

  pypi:
    needs: [wheels, sdist]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist

  crates:
    needs: check
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
