name: Results site

on:
  push:
    branches: [main]
    paths:
      - "calibration/**"
      - "site/**"
      - ".github/workflows/site.yml"
  schedule:
    - cron: "17 6 * * 1" # weekly, Monday 06:17 UTC
    - cron: "7 */2 * * *" # every 2 hours: element sets
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      # Cheap experiments rerun on fresh data every build: Wikidata as edited
      # today, airport weather over the last 365 days. If a public source is
      # down, the committed results are used instead.
      - name: Refresh CEO and weather results
        if: github.event.schedule != '7 */2 * * *'
        continue-on-error: true
        working-directory: calibration
        env:
          FID_WEATHER_TRAILING_DAYS: "365"
        run: |
          python3 wikidata_ceo.py > /dev/null
          python3 weather_metar.py > /dev/null

      - name: Build site
        run: python3 site/build.py

      - id: pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      # After build.py, which recreates site/_site. Only the 2-hourly run
      # downloads from CelesTrak (one request per object per update cycle);
      # every other build republishes the published tle.json unchanged.
      - name: Fetch satellite element sets
        env:
          BASE_URL: ${{ steps.pages.outputs.base_url }}
          FETCH: ${{ github.event.schedule == '7 */2 * * *' && '--fetch' || '' }}
        run: python3 site/fetch_tle.py site/_site/data/tle.json "$BASE_URL" $FETCH

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site/_site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
