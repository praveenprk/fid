name: Results site

on:
  push:
    branches: [main]
    paths:
      - "calibration/**"
      - "site/**"
      - ".github/workflows/site.yml"
  schedule:
    - cron: "17 6 * * 1" # weekly, Monday 06:17 UTC
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      # Cheap experiments rerun on fresh data every build: Wikidata as edited
      # today, airport weather over the last 365 days. If a public source is
      # down, the committed results are used instead.
      - name: Refresh CEO and weather results
        continue-on-error: true
        working-directory: calibration
        env:
          FID_WEATHER_TRAILING_DAYS: "365"
        run: |
          python3 wikidata_ceo.py > /dev/null
          python3 weather_metar.py > /dev/null

      - name: Build site
        run: python3 site/build.py

      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0

      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: site/_site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
