name: Results site

on:
  push:
    branches: [main]
    paths:
      - "calibration/**"
      - "site/**"
      - ".github/workflows/site.yml"
  schedule:
    - cron: "17 6 * * 1" # weekly, Monday 06:17 UTC
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      # Cheap experiments rerun on fresh data every build: Wikidata as edited
      # today, airport weather over the last 365 days. If a public source is
      # down, the committed results are used instead.
      - name: Refresh CEO and weather results
        continue-on-error: true
        working-directory: calibration
        env:
          FID_WEATHER_TRAILING_DAYS: "365"
        run: |
          python3 wikidata_ceo.py > /dev/null
          python3 weather_metar.py > /dev/null

      - name: Build site
        run: python3 site/build.py

      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site/_site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
