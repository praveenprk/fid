name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Conformance vectors match the spec
        run: python3 conformance/generate.py && git diff --exit-code conformance/
      - name: Every requirement in the draft is tested or a listed gap
        run: python3 spec/trace.py && git diff --exit-code spec/TRACEABILITY.md
      - run: cargo test

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build and test the Python package
        working-directory: bindings/python
        run: |
          python -m venv .venv
          . .venv/bin/activate
          pip install "maturin>=1.5,<2"
          maturin develop --release
          python -m unittest discover -s tests -v
      - name: Calibration tests (no network; they use the fid package built above)
        working-directory: calibration
        run: ../bindings/python/.venv/bin/python -m unittest discover -p 'test_*.py' -v

  spec:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install kramdown-rfc and xml2rfc
        run: |
          gem install --no-document kramdown-rfc -v 1.7.43
          pip install xml2rfc==3.34.1
      - name: Build the draft (fails on any error or kramdown-rfc warning)
        run: spec/build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: draft-kumar-fid
          path: |
            spec/build/*.txt
            spec/build/*.html
