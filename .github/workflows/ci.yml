name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Conformance vectors match the spec
        run: python3 conformance/generate.py && git diff --exit-code conformance/
      - run: cargo test

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build and test the Python package
        working-directory: bindings/python
        run: |
          python -m venv .venv
          . .venv/bin/activate
          pip install "maturin>=1.5,<2"
          maturin develop --release
          python -m unittest discover -s tests -v
