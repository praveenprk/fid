name: Spec reference

# A PR that changes behaviour must name the draft sections or issues it
# implements (spec/spec_ref.py). Runs again when the description or
# labels change. The description reaches the script only through an
# environment variable, never through the shell.
on:
  pull_request:
    types: [opened, synchronize, reopened, edited, labeled, unlabeled]

permissions:
  contents: read

jobs:
  spec-ref:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Changed files
        id: changed
        run: |
          {
            echo 'files<<EOF'
            git diff --name-only "${{ github.event.pull_request.base.sha }}...${{ github.event.pull_request.head.sha }}"
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"
      - name: Behaviour changes cite the draft
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
          CHANGED_FILES: ${{ steps.changed.outputs.files }}
        run: python3 spec/spec_ref.py
