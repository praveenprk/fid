# Automated dependency update proposals (eng-principles ENG-STD-008
# `dependabot`; OpenSSF Scorecard Dependency-Update-Tool; V-ENG-008-02).
# Updates arrive as pull requests into `main`. Their titles carry no anchor;
# `commit-check` accepts them as Dependabot version bumps (eng-principles
# ENG-DEC-021). Do not use "Update branch" on them: that adds a commit
# Dependabot did not sign, which needs an anchor. Ask "@dependabot rebase".
# Dependency updates are security-related: PK merges them (AGENTS.md).
# Tools CI installs by exact version (Rust toolchain, ruff, the maturin
# range) are pinned in the workflows and are not covered here.
version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(deps)"
    ignore:
      # sha2 0.11.1 and later need Rust 1.88; fid supports 1.85 (Q-006).
      # Remove this rule when rust-version is raised.
      - dependency-name: sha2
        versions: [">= 0.11"]
  - package-ecosystem: cargo
    directory: /bindings/python
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(deps)"
  - package-ecosystem: pip
    directory: /bindings/python
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(deps)"
  # The CI lint tools for the site's scripts (package.json and
  # package-lock.json at the root, added by #34; until then this entry
  # finds no manifest and does nothing).
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(deps)"
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(ci)"
