[package]
name = "fid"
version = "0.1.0"
edition = "2021"
description = "Information fidelity measurement for computing systems"
license = "Apache-2.0"
repository = "https://github.com/praveenprk/fid"
readme = "README.md"
keywords = ["fidelity", "information", "measurement", "signal", "unix"]
categories = ["command-line-utilities"]

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
sha2 = "0.10"
chrono = { version = "0.4", features = ["serde"] }

[profile.release]
opt-level = 3
lto = true
strip = true
