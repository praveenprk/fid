[package]
name = "fidmeter"
version = "0.1.1"
edition = "2021"
rust-version = "1.80"
description = "Information fidelity measurement: how much a stored fact can still be trusted, calibrated against real data"
license = "Apache-2.0"
repository = "https://github.com/praveenprk/fid"
homepage = "https://praveenprk.github.io/fid/"
readme = "README.md"
keywords = ["fidelity", "staleness", "decay", "provenance", "data-quality"]
categories = ["command-line-utilities", "science"]
include = ["src/**", "tests/**", "conformance/vectors.json", "conformance/ledger-example.csv", "examples/*.yaml", "README.md", "LICENSE", "Cargo.toml", "Cargo.lock"]

# The package is fidmeter (the name fid is taken on crates.io);
# the library and the command are both still `fid`.
[lib]
name = "fid"
path = "src/lib.rs"

[[bin]]
name = "fid"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
serde_yaml = "0.9"
sha2 = "0.10"
chrono = { version = "0.4", features = ["serde"] }
csv = "1"

[profile.release]
opt-level = 3
lto = true
strip = true
