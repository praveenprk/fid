# Half-life registry — maps information types to their decay rates.
#
# The half-life is the time after which the probability of
# correspondence to reality drops to 50%. This is a physical
# property of the information type, not a policy choice.
#
# Organizations declare their own half-lives based on their
# domain reality. This file is the equivalent of a calibration
# certificate — it records the assumption under which fidelity
# is computed.
#
# An entry is a half-life, or a map with:
#   half_life — time for fidelity to fall halfway to the baseline
#   baseline  — chance the fact is right anyway once fully stale
#   source_fidelity — measured fraction correct when fresh; replaces
#               the source class value (fid calibrate writes it)
#   states    — per-state overrides (look up with --state)
#
#   fid stamp --half-lives half-lives.yaml --type vessel_position --state underway ...

# ── Measured ────────────────────────────────────────────────────
# Fitted to public ground-truth data; see calibration/README.md.
# No source_fidelity here: these studies check a source against its own
# later reading, so every fact is right when fresh by construction.

company_ceo:        5.8y          # Wikidata CEO tenures, 2004–2026

airport_flight_category:          # METAR, 10 US airports, 2024
  half_life:  2.9h
  baseline:   0.73                # stale "VFR" is usually still right

airport_ifr:                      # same data, IFR-or-worse reports
  half_life:  3.5h
  baseline:   0.20

vessel_position:                  # NOAA AIS, 6,592 cargo ships + tankers, 6 days of 2023, ±1 km
  states:
    underway: { half_life: 1.9m, baseline: 0.02 }
    moored:   1.4d                # moored or at anchor; only 12h observed

# airport_temperature is deliberately absent: it is periodic (a 24h-old
# reading beats a 12h-old one), which no decay model expresses.

# ── Hand-picked, not yet measured ───────────────────────────────
# employee_role was guessed at 1y; CEOs measured 5.8y (above).

stock_price:        30s
forex_rate:          1m
weather_forecast:    6h
news_headline:       3d
product_inventory:  12h
shipping_status:     4h
social_media_post:   7d
mailing_address:     3y
legal_name:         20y
phone_number:        2y
email_address:     18mo
employee_role:       1y
company_revenue:    90d
medical_diagnosis:  domain_specific
drug_interaction:   domain_specific
sensor_reading:     domain_specific
llm_inference:       7d
mathematical:       infinite
physical_constant:  infinite
